name: Bug report
description: Report a reproducible problem in WoW Chat
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: addon_version
    attributes:
      label: WoW Chat version
      placeholder: v0.9.1
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: WoW client/build
      placeholder: Legion 7.3.5 / build 26124
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Lua error / BugGrabber output
      render: text
